name: Release CachyOS / Arch Linux Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-arch-pkg:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm nodejs npm rust cargo webkit2gtk-4.1 gtk3 ffmpeg android-tools git github-cli

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Frontend & Native Rust Binary
        run: |
          npm install
          node node_modules/esbuild/install.js || true
          npm run build
          cd src-tauri && cargo build --release

      - name: Build .pkg.tar.zst with makepkg
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd packaging/arch && makepkg -f --nodeps"

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" packaging/arch/*.pkg.tar.zst --clobber || \
          gh release create "$TAG" packaging/arch/*.pkg.tar.zst --title "rec-ording $TAG (Arch / CachyOS)" --notes "Paquete nativo x86_64 (.pkg.tar.zst) para Arch Linux y CachyOS."
