name: Release Arch Linux package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-arch-pkg:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm rust cargo vulkan-icd-loader ffmpeg git github-cli

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release binary
        run: |
          cargo build --release

      - name: Build .pkg.tar.zst with makepkg
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd packaging/arch && makepkg -f --nodeps"

      # The app updates itself from the public releases repository (this one is private).
      - name: Publish to the releases repository
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: blzkz/rec-ording-releases
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          git config --global --add safe.directory "$PWD"
          git log -1 --format=%B > notes.md
          # The Windows workflow may create the same release at the same time; retry the upload.
          gh release upload "$TAG" packaging/arch/*.pkg.tar.zst --clobber -R "$REPO" || \
          gh release create "$TAG" packaging/arch/*.pkg.tar.zst -R "$REPO" --title "rec-ording $TAG" --notes-file notes.md || \
          (sleep 20 && gh release upload "$TAG" packaging/arch/*.pkg.tar.zst --clobber -R "$REPO")
