name: Release CachyOS / Arch Linux Package (Pure Rust + Vulkan)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-arch-pkg:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch dependencies (Pure Rust + Vulkan)
        run: |
          pacman -Syu --noconfirm rust cargo vulkan-icd-loader ffmpeg android-tools git github-cli

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Pure Rust + Vulkan Binary
        run: |
          cargo build --release

      - name: Build .pkg.tar.zst with makepkg
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd packaging/arch && makepkg -f --nodeps"

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" packaging/arch/*.pkg.tar.zst --clobber || \
          gh release create "$TAG" packaging/arch/*.pkg.tar.zst --title "rec-ording $TAG (100% Rust + Vulkan · Arch / CachyOS)" --notes "Paquete nativo 100% Rust + Vulkan (wgpu) + Rayon multihilo (.pkg.tar.zst) para Arch Linux y CachyOS. Cero Node.js / Cero WebView."
