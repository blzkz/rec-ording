name: Windows

# Only for releases (a `v*` tag) or when launched by hand: Windows minutes count double
# against the private repository's monthly allowance.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg (for the end-to-end test)
        run: choco install ffmpeg -y --no-progress

      - name: Test
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Package .zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $name = "rec-ording-$version-windows-x64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/rec-ording.exe "dist/$name/"
          Copy-Item -Recurse assets/models "dist/$name/models"
          Copy-Item packaging/windows/LEEME.txt "dist/$name/"
          Copy-Item assets/fonts/OFL.txt "dist/$name/Inter-OFL.txt"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          "NAME=$name" >> $env:GITHUB_ENV

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}

      # The app updates itself from the public releases repository (this one is private).
      - name: Publish to the releases repository
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: blzkz/rec-ording-releases
        run: |
          ZIP="dist/$NAME.zip"
          TAG="${GITHUB_REF#refs/tags/}"
          git log -1 --format=%B > notes.md
          # The Arch workflow may create the same release at the same time; retry the upload.
          gh release upload "$TAG" "$ZIP" --clobber -R "$REPO" || \
          gh release create "$TAG" "$ZIP" -R "$REPO" --title "rec-ording $TAG" --notes-file notes.md || \
          (sleep 20 && gh release upload "$TAG" "$ZIP" --clobber -R "$REPO")
