[package]
name = "rec-ording"
version = "0.1.0"
description = "rec-ording — Grabador y Estudio de Edición 3D con FFmpeg, ADB y MCP"
authors = ["rec-ording Team"]
edition = "2021"

[lib]
name = "rec_ording_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
