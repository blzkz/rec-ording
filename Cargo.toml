[package]
name = "rec-ording"
version = "0.14.0"
edition = "2021"
authors = ["blzkz <sergiobl88@gmail.com>"]
description = "Graba tu móvil Android y conviértelo en un vídeo promocional con marco, fondo y zooms automáticos"
license = "MIT"

[[bin]]
name = "rec-ording"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.30", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.30"
rayon = "1.10"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ab_glyph = "0.2"
# Composing export frames on the graphics card (already used by the window).
wgpu = { version = "23", default-features = false, features = ["wgsl"] }
pollster = "0.4"
# Plays the preview's sound.
cpal = "0.15"
bytemuck = "1"
gltf = { version = "1.4", features = ["KHR_texture_transform", "KHR_materials_unlit", "KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_emissive_strength"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
# DirectX 12 for the window, where Vulkan drivers are missing or poor.
wgpu = { version = "23", default-features = false, features = ["dx12"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }

[build-dependencies]
# Icon and name of the Windows .exe.
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
