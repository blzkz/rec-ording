[package]
name = "rec-ording"
version = "0.6.3"
edition = "2021"
authors = ["blzkz <sergiobl88@gmail.com>"]
description = "Graba tu móvil Android y conviértelo en un vídeo promocional con marco, fondo y zooms automáticos"
license = "MIT"

[[bin]]
name = "rec-ording"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.30", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.30"
rayon = "1.10"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gltf = { version = "1.4", features = ["KHR_texture_transform", "KHR_materials_unlit", "KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_emissive_strength"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
